<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>النتائج — منصة الأول</title>
<link rel="stylesheet" href="styles.css">
<style>
/* ══════════════════════════════════════
   RESULT PAGE — Futuristic Space UI
   ══════════════════════════════════════ */

/* ─── Stage ─── */
.result-stage {
  height: calc(100vh - 72px);
  overflow: hidden;
  padding: 20px 5% 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  position: relative;
  z-index: 2;
}

/* ─── Page Title ─── */
.r-title {
  font-size: clamp(1.6rem, 3.5vw, 2.6rem);
  font-weight: 900;
  color: #fff;
  text-align: center;
  margin-bottom: 4px;
  letter-spacing: 3px;
  animation: fadeUp 0.8s ease both;
  position: relative;
}


/* ─── Main Layout ─── */
.r-layout {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 1300px;
  gap: 0;
  transition: gap 0.9s cubic-bezier(0.4, 0, 0.2, 1);
}
.r-layout.revealed {
  gap: 80px;
}

/* ══════════════════════════════════════
   RIGHT — Result Info
   (first in DOM = rightmost in RTL flex)
   ══════════════════════════════════════ */
.r-info {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  max-width: 0;
  overflow: hidden;
  opacity: 0;
  transition:
    max-width 0.85s cubic-bezier(0.4, 0, 0.2, 1) 0s,
    opacity   0.55s ease 0.58s;
}
.r-layout.revealed .r-info {
  max-width: 480px;
  opacity: 1;
}

/* Percent number */
.r-percent {
  font-size: clamp(2.8rem, 7vw, 5rem);
  font-weight: 900;
  line-height: 1;
  white-space: nowrap;
  background: linear-gradient(#fff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: glowPct 3s ease-in-out infinite;
}
@keyframes glowPct {
  0%,100% { filter: drop-shadow(0 0 16px rgba(124,58,237,0.35)); }
  50%     { filter: drop-shadow(0 0 50px rgba(124,58,237,0.8)); }
}

.r-field-tag {
  font-size: 1.05rem;
  color: rgba(255,255,255,0.6);
  margin: 10px 0 36px;
  white-space: nowrap;
  letter-spacing: 1px;
}

/* CTA Button */
.r-cta {
  padding: 11px 28px;
  border-radius: 60px;
  border: none;
  background: linear-gradient(135deg, #7c3aed 0%, #a855f7 55%, #00a8aa 100%);
  color: #fff;
  font-family: var(--font);
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  letter-spacing: 0.5px;
  position: relative;
  overflow: hidden;
  box-shadow:
    0 8px 32px rgba(124,58,237,0.45),
    0 0 0 1px rgba(255,255,255,0.12) inset;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.r-cta::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg,rgba(255,255,255,0.12),transparent);
  border-radius: inherit;
}
.r-cta:hover {
  transform: translateY(-5px) scale(1.02);
  box-shadow:
    0 18px 50px rgba(124,58,237,0.6),
    0 0 0 1px rgba(255,255,255,0.18) inset;
}
.r-cta:active { transform: translateY(-2px) scale(0.99); }

/* ══════════════════════════════════════
   LEFT — Triangle + Rocket
   (second in DOM = leftmost in RTL flex)
   ══════════════════════════════════════ */
.r-tri-section {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: fadeUp 0.9s ease 0.25s both;
}

/* Triangle wrapper */
.r-tri-wrap {
  position: relative;
  width: min(580px, 62vh);
  height: min(580px, 62vh);
}

/* Purple triangle image */
.r-tri-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  filter: none;
  animation: none;
}
@keyframes triPulse {
  0%,100% { filter: none}
  50%     { filter: none }
}

/* Rocket */
.r-rocket {
  position: absolute;
  width: min(740px, 76vh);
  top: 46%;
  left: 50%;
  transform: translate(-50%, -50%);
  transform-origin: 50% 65%;
  transition: transform 1.3s cubic-bezier(0.34, 1.2, 0.64, 1);
  filter: none;
  animation: none;
}
@keyframes rocketFloat {
  0%,100% { filter: none; }
  50%     { filter: none; }
}
.r-rocket.launched {
  transform: translate(-70%, -64%) rotate(40deg) scale(1);
  animation: none;
  filter: none;
}

/* Progress bar */
.r-bar-wrap {
  position: absolute;
  bottom: 16%;
  left: 50%;
  transform: translateX(-50%);
  width: 46%;
  height: 9px;
  background: rgba(255,255,255,0.1);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 0 10px rgba(0,0,0,0.4) inset;
  direction: ltr; /* يملأ من اليسار لليمين */
}
.r-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #6d28d9, #a78bfa, #c4b5fd);
  border-radius: 20px;
  position: relative;
  transition: width 0.04s linear;
}
.r-bar-fill::after {
  content: '';
  position: absolute;
  right: -4px;
  top: 0;
  bottom: 0;
  width: 18px;
  background: rgba(255,255,255,0.5);
  filter: blur(5px);
  border-radius: 50%;
}

/* Field name label below triangle */
.r-field-lbl {
  font-size: clamp(1.3rem, 2.5vw, 1.9rem);
  font-weight: 700;
  color: #fff;
  margin-top: 10px;
  text-shadow: 0 0 28px rgba(124,58,237,0.7);
  letter-spacing: 2px;
}

/* ─── Floating Stars ─── */
.r-stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}
.r-star {
  position: absolute;
  background: #fff;
  border-radius: 50%;
  opacity: 0;
  animation: starRise var(--d) linear var(--dl) infinite;
}
@keyframes starRise {
  0%   { opacity: 0; transform: translateY(105vh) scale(0.5); }
  12%  { opacity: var(--op); }
  88%  { opacity: var(--op); }
  100% { opacity: 0; transform: translateY(-8vh) scale(1); }
}

/* ─── Particle burst on launch ─── */
.r-spark {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  pointer-events: none;
  animation: sparkOut 0.8s ease-out forwards;
}
@keyframes sparkOut {
  0%   { opacity: 1; transform: translate(0,0) scale(1); }
  100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
}

/* ══════════════════════════════════════
   RESPONSIVE
   ══════════════════════════════════════ */
@media (max-width: 1100px) {
  .r-layout.revealed { gap: 50px; }
}

@media (max-width: 820px) {
  .result-stage {
    height: calc(100vh - 72px); overflow: hidden;
    padding: 16px 20px 10px;
    justify-content: center;
    gap: 6px;
  }
  .r-layout,
  .r-layout.revealed {
    flex-direction: column !important;
    gap: 16px !important;
  }
  .r-info {
    max-width: 100% !important;
    overflow: visible !important;
    order: 2;
  }
  .r-tri-section { order: 1; }
  .r-tri-wrap { width: min(320px, 40vh); height: min(320px, 40vh); }
  .r-rocket   { width: min(295px, 37vh); }
  .r-bar-wrap { bottom: 14%; width: 44%; height: 8px; }
  .r-percent  { font-size: clamp(2.2rem, 8vw, 3.5rem); }
  .r-layout.revealed .r-info { max-width: 100%; }
}

@media (max-width: 480px) {
  .r-tri-wrap { width: min(270px, 37vh); height: min(270px, 37vh); }
  .r-rocket   { width: min(250px, 34vh); }
  .r-percent  { font-size: clamp(2rem, 8vw, 3rem); }
  .r-cta      { font-size: 0.82rem; padding: 10px 20px; }
}
</style>
</head>

<body>

<!-- Glass overlay (from styles.css) -->
<div class="page-glass"></div>

<!-- Floating background stars -->
<div class="r-stars" id="rStars"></div>

<!-- ══ Header ══ -->
<header class="hdr solid" id="hdr">
  <a href="index.html" class="logo">
    <img class="logo-img" src="assets/logo.png" alt="منصة الأول">
  </a>
  <ul class="nav" id="mainNav">
    <li><a href="index.html">الصفحة الرئيسية</a></li>
    <li><a href="index.html#pioneers-sec">رواد التميز</a></li>
    <li><a href="index.html#fields-sec">المجالات</a></li>
    <li><a href="index.html#about-sec">من نحن</a></li>
  </ul>
  <a href="#" class="btn-login">تسجيل الدخول</a>
  <div class="burger" id="burger"><span></span><span></span><span></span></div>
</header>

<!-- ══ Result Stage ══ -->
<main class="result-stage">

  <h1 class="r-title">المجالات</h1>

  <div class="r-layout" id="rLayout">

    <!--
      In RTL flexbox (dir="rtl"), flex-direction:row starts from the RIGHT.
      First child  → rightmost position = visual RIGHT
      Second child → leftmost  position = visual LEFT
    -->

    <!-- RIGHT: Info section (hidden initially, max-width:0) -->
    <div class="r-info" id="rInfo">
      <div class="r-percent" id="rPercent">0%</div>
  
      <button class="r-cta" onclick="location.href='pioneers.html'">
        تعرف على رواد الفضاء
      </button>
    </div>

    <!-- LEFT: Triangle + Rocket -->
    <div class="r-tri-section">
      <div class="r-tri-wrap" id="rTriWrap">
        <img src="assets/بنفسجي.png"  class="r-tri-img" alt="">
        <img src="assets/icon-space.png" class="r-rocket" id="rRocket" alt="صاروخ">
        <div class="r-bar-wrap">
          <div class="r-bar-fill" id="rBarFill"></div>
        </div>
      </div>
      <p class="r-field-lbl">علم الفضاء</p>
    </div>

  </div>

</main>

<!-- Shared scripts -->
<script src="script.js"></script>

<script>
(function () {
  'use strict';

  /* ── Generate background stars ── */
  const starsContainer = document.getElementById('rStars');
  for (let i = 0; i < 80; i++) {
    const star = document.createElement('div');
    star.className = 'r-star';
    const size = 1 + Math.random() * 2.2;
    star.style.cssText =
      'left:'  + (Math.random() * 100).toFixed(1) + '%;' +
      'width:' + size.toFixed(1) + 'px;height:' + size.toFixed(1) + 'px;' +
      '--d:'   + (5 + Math.random() * 8).toFixed(1) + 's;' +
      '--dl:'  + (Math.random() * 12).toFixed(1) + 's;' +
      '--op:'  + (0.3 + Math.random() * 0.55).toFixed(2) + ';';
    starsContainer.appendChild(star);
  }

  /* ── Element references ── */
  const barFill  = document.getElementById('rBarFill');
  const rocket   = document.getElementById('rRocket');
  const layout   = document.getElementById('rLayout');
  const pctEl    = document.getElementById('rPercent');
  const triWrap  = document.getElementById('rTriWrap');

  const TARGET_PCT = 80;
  const isMobile   = () => window.innerWidth <= 820;

  /* ── Spark burst particles ── */
  function burstSparks() {
    const rect   = triWrap.getBoundingClientRect();
    const cx     = rect.left + rect.width  / 2;
    const cy     = rect.top  + rect.height * 0.44;
    const colors = ['#a78bfa', '#7c3aed', '#c4b5fd', '#00a8aa', '#fff'];
    for (let i = 0; i < 18; i++) {
      const sp = document.createElement('div');
      sp.className = 'r-spark';
      const angle = (Math.PI * 2 * i) / 18;
      const dist  = 60 + Math.random() * 80;
      sp.style.cssText =
        'left:' + cx + 'px;top:' + cy + 'px;' +
        'position:fixed;z-index:999;' +
        'background:' + colors[i % colors.length] + ';' +
        '--tx:' + (Math.cos(angle) * dist).toFixed(0) + 'px;' +
        '--ty:' + (Math.sin(angle) * dist).toFixed(0) + 'px;';
      document.body.appendChild(sp);
      setTimeout(() => sp.remove(), 850);
    }
  }

  /* ── Count-up animation for percent ── */
  function countUp(target, duration) {
    let start = 0;
    const step = target / (duration / 20);
    const timer = setInterval(() => {
      start = Math.min(start + step, target);
      pctEl.textContent = Math.round(start) + '%';
      if (start >= target) clearInterval(timer);
    }, 20);
  }

  /* ── Progress bar animation ── */
  let pct  = 0;
  const TOTAL_MS  = 2000;
  const TICK_MS   = 30;
  const PCT_STEP  = 100 / (TOTAL_MS / TICK_MS);

  function startProgress() {
    const timer = setInterval(() => {
      pct = Math.min(pct + PCT_STEP, 100);
      barFill.style.width = pct + '%';

      if (pct >= 100) {
        clearInterval(timer);
        onLoadingComplete();
      }
    }, TICK_MS);
  }

  /* ── After loading bar reaches 100% ── */
  function onLoadingComplete() {
    setTimeout(() => {
      burstSparks();
      rocket.classList.add('launched');

      setTimeout(() => {
        layout.classList.add('revealed');
        countUp(TARGET_PCT, 700);
      }, 380);

    }, 220);
  }

  /* ── Mobile: skip count-up, just show info ── */
  function mobileReveal() {
    layout.classList.add('revealed');
    pctEl.textContent = TARGET_PCT + '%';
    const info = document.getElementById('rInfo');
    info.style.maxWidth  = '100%';
    info.style.overflow  = 'visible';
    info.style.opacity   = '1';
  }

  /* ── Start sequence ── */
  setTimeout(() => {
    if (isMobile()) {
      startProgress();
      setTimeout(mobileReveal, TOTAL_MS + 800);
    } else {
      startProgress();
    }
  }, 700);

})();
</script>

</body>
</html>
