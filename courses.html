<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الكورسات</title>
<link rel="stylesheet" href="styles.css">
<style>

body {
    background: url('assets/courses_bg.png') no-repeat center center fixed;
    background-size: cover;
    margin: 0;
    padding: 0;
    background-color: rgba(16, 16, 37, 1);
}

.main-title {
    text-align: center;
    margin: 0;
    padding-top: 30px;
    font-size: 55px;
}

.page-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 100px);
}

.courses-row {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 100px;
    width: 95%;
    margin: 40px auto;
    overflow-x: auto;
    padding-bottom: 10px;
}

.course-card {
    position: relative;
    display: flex;
    flex-direction: row-reverse;
    align-items: flex-end;
    flex-shrink: 0;
    cursor: pointer;
}

/* ── الرقم أكبر ── */
.before {
    width: 170px;           /* كان 130px */
    height: auto;
    display: block;
    object-fit: contain;
    object-position: bottom;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
    transition: transform 0.3s ease;
}

.course-card:hover .before {
    transform: translateY(-8px);
}

/* ── wrapper أكبر ── */
.after-wrapper {
    position: relative;
    width: 0;
    height: 400px;          /* كان 320px */
    overflow: hidden;
    opacity: 0;
    flex-shrink: 0;
    align-self: flex-end;
    transition: width 0.45s ease, opacity 0.35s ease;
    margin-left: -15px;
    z-index: 1;
}

/* ── صورة after أكبر ── */
.after-img {
    display: block;
    width: 350px;           /* كان 280px */
    height: 400px;          /* كان 320px */
    object-fit: cover;
    object-position: center 40px;
    border-radius: 20px;
    flex-shrink: 0;
}


.arrow-link {
    position: absolute;
    top: 30px;
    right: 5px;
    width: 90px;
    height: 90px;
    background: none;       /* بدون خلفية */
    border: none;           /* بدون حواف */
    border-radius: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s ease 0.2s, transform 0.2s ease;
    z-index: 10;
}

.arrow-link:hover {
    transform: scale(1.15); /* يكبر قليلاً عند hover بدل خلفية */
}

.arrow-link img {
    width: 90px;         
    height: 90px;
    display: block;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.40)); /* ظل خفيف للوضوح */
}

/* ── عند الـ hover ── */
.course-card:hover .after-wrapper {
    width: 350px;           /* نفس عرض after-img */
    opacity: 1;
}

.course-card:hover .arrow-link {
    opacity: 1;
}

/* Tablet */
@media (max-width:1024px){

    .courses-row{
        gap:25px;
    }

    .course-card:hover .after-wrapper{
        width:280px;
    }

    .after-img{
        width:280px;
    }
}

/* Mobile */
@media (max-width:768px){

    .courses-row{
        flex-direction:column;
        align-items:center;
        gap:30px;
    }

    .course-card{
        width:100%;
        max-width:360px;
        justify-content:center;
    }

    .before{
        width:120px;
    }

    .after-wrapper{
        width:220px;
        opacity:1;
        height:280px;
    }

    .after-img{
        width:220px;
        height:280px;
    }

    .course-card:hover .after-wrapper{
        width:220px;
    }

    .arrow-link{
        opacity:1;
        width:60px;
        height:60px;
    }
}

</style>
</head>
<body>

<div class="overlay"></div>

  <a href="index.html" class="logo"> <img class="logo-img" src="assets/شعار ابيض (1).png" alt="منصة الأول"> </a>
