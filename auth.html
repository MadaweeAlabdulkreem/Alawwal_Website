<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة الأول – تسجيل الدخول</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="page-glass2" aria-hidden="true"></div>

<!-- ══════════ HEADER ══════════ -->
<header class="hdr" id="hdr">
  <a href="index.html" class="logo"> <img class="logo-img" src="assets/شعار ابيض (1).png" alt="منصة الأول"> </a>
  
  <ul class="nav" id="mainNav">
    <li><a href="index.html">الصفحة الرئيسية</a></li>
    <li><a href="#pioneers-sec">رواد التميز</a></li>
    <li><a href="#fields-sec">المجالات</a></li>
    <li><a href="#about-sec">من نحن</a></li>
  </ul>
  <a href="auth.html" class="btn-login" id="loginBtn">تسجيل الدخول</a>
  <span class="user-welcome" id="userWelcome" style="display:none;">مرحباً <span id="userName"></span> <button class="logout-btn" onclick="logout()">خروج</button></span>
  <div class="burger" id="burger"><span></span><span></span><span></span></div>
</header>

<!-- ══════════ AUTH SECTION ══════════ -->
<main class="auth-pg">
  <div class="auth-card">

    <!-- Logo inside card -->
    <div class="auth-logo">
      <img src="assets/logo.png" alt="منصة الأول">
    </div>

    <!-- Tabs -->
    <div class="auth-tabs" role="tablist">
      <button class="tab-btn active" id="tab-login" role="tab" aria-selected="true" aria-controls="panel-login" onclick="switchTab('login')">
        تسجيل الدخول
      </button>
      <button class="tab-btn" id="tab-signup" role="tab" aria-selected="false" aria-controls="panel-signup" onclick="switchTab('signup')">
        إنشاء حساب
      </button>
      <div class="tab-slider" id="tabSlider"></div>
    </div>

    <!-- ── LOGIN PANEL ── -->
    <div class="auth-panel active" id="panel-login" role="tabpanel">
      <form id="loginForm" novalidate autocomplete="on" onsubmit="submitLogin(event)">

        <div class="field-group">
          <label for="l-email">البريد الإلكتروني</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </span>
            <input type="email" id="l-email" name="email" placeholder="example@email.com" autocomplete="email" dir="ltr">
          </div>
          <span class="err-msg" id="l-email-err"></span>
        </div>

        <div class="field-group">
          <label for="l-pass">كلمة المرور</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="l-pass" name="password" placeholder="••••••••" autocomplete="current-password" dir="ltr">
            <button type="button" class="eye-btn" onclick="togglePass('l-pass', this)" aria-label="إظهار كلمة المرور">
              <svg class="eye-open" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-close" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <span class="err-msg" id="l-pass-err"></span>
        </div>

        <div class="forgot-row">
          <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
        </div>

        <button type="submit" class="auth-btn">
          <span class="btn-text">تسجيل الدخول</span>
          <span class="btn-loader" aria-hidden="true"></span>
        </button>

        <p class="switch-hint">ليس لديك حساب؟ <button type="button" class="inline-link" onclick="switchTab('signup')">إنشاء حساب</button></p>
      </form>
    </div>

    <!-- ── SIGN UP PANEL ── -->
    <div class="auth-panel" id="panel-signup" role="tabpanel">
      <form id="signupForm" novalidate autocomplete="off" onsubmit="submitSignup(event)">

        <div class="field-group">
          <label for="s-name">الاسم الكامل</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            </span>
            <input type="text" id="s-name" name="fullname" placeholder="محمد أحمد العمري" autocomplete="name">
          </div>
          <span class="err-msg" id="s-name-err"></span>
        </div>

        <div class="field-group">
          <label for="s-email">البريد الإلكتروني</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </span>
            <input type="email" id="s-email" name="email" placeholder="example@email.com" autocomplete="email" dir="ltr">
          </div>
          <span class="err-msg" id="s-email-err"></span>
        </div>

        <div class="field-group">
          <label for="s-phone">رقم الهاتف</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </span>
            <input type="tel" id="s-phone" name="phone" placeholder="05XXXXXXXX" autocomplete="tel" dir="ltr" maxlength="15">
          </div>
          <span class="err-msg" id="s-phone-err"></span>
        </div>

        <div class="field-group">
          <label for="s-pass">كلمة المرور</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="s-pass" name="password" placeholder="••••••••" autocomplete="new-password" dir="ltr" oninput="checkStrength(this.value)">
            <button type="button" class="eye-btn" onclick="togglePass('s-pass', this)" aria-label="إظهار كلمة المرور">
              <svg class="eye-open" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-close" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <!-- Strength meter -->
          <div class="strength-meter" id="strengthMeter" aria-hidden="true">
            <div class="strength-bars">
              <span class="sbar" id="sb1"></span>
              <span class="sbar" id="sb2"></span>
              <span class="sbar" id="sb3"></span>
              <span class="sbar" id="sb4"></span>
            </div>
            <span class="strength-label" id="strengthLabel"></span>
          </div>
          <ul class="pass-rules" id="passRules">
            <li id="rule-len"><span class="rule-dot"></span>٨ أحرف على الأقل</li>
            <li id="rule-num"><span class="rule-dot"></span>رقم واحد على الأقل</li>
            <li id="rule-sym"><span class="rule-dot"></span>رمز خاص (! @ # ...)</li>
          </ul>
          <span class="err-msg" id="s-pass-err"></span>
        </div>

        <div class="field-group">
          <label for="s-confirm">تأكيد كلمة المرور</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 12 2 2 4-4"/><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="s-confirm" name="confirm" placeholder="••••••••" autocomplete="new-password" dir="ltr">
            <button type="button" class="eye-btn" onclick="togglePass('s-confirm', this)" aria-label="إظهار كلمة المرور">
              <svg class="eye-open" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-close" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <span class="err-msg" id="s-confirm-err"></span>
        </div>

        <button type="submit" class="auth-btn">
          <span class="btn-text">إنشاء الحساب</span>
          <span class="btn-loader" aria-hidden="true"></span>
        </button>

        <p class="switch-hint">لديك حساب بالفعل؟ <button type="button" class="inline-link" onclick="switchTab('login')">تسجيل الدخول</button></p>
      </form>
    </div>

  </div>
</main>

<!-- ══════════ FOOTER ══════════ -->

              <stop offset="0%" stop-color="#00a8aa"/>

              <stop offset="0%" stop-color="#00a8aa"/>

            </linearGradient>
          </defs>

      <a href="alawal.l2026@gmail.com" class="soc-link" title="البريد الإلكتروني" aria-label="Email">

          <defs>
            <linearGradient id="em" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00a8aa"/>
              <stop offset="100%" stop-color="#c084fc"/>

          </defs>
          <rect x="2" y="4" width="20" height="16" rx="2"/>

    <div class="footer-copy">جميع الحقوق محفوظة Alawwal &copy; 2026</div>
  </div>
</footer>

<script src="script.js"></script>
<script src="auth.js"></script>
</body>
</html>
