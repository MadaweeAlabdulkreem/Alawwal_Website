<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>رواد الفضاء — منصة الأول</title>
<link rel="stylesheet" href="styles.css">
<style>
/* ════════════════════════════════════════
   PIONEERS PAGE
   ════════════════════════════════════════ */

.pio-bg {
  position: fixed; inset: 0; z-index: 0;
  background-size: cover; background-position: center top;
  background-repeat: no-repeat;
  transition: opacity 0.8s ease; pointer-events: none;
}
#pioBgA { opacity: 1; }
#pioBgB { opacity: 0; }

.pio-overlay {
  position: fixed; inset: 0; z-index: 1;
  pointer-events: none;
  transition: background-color 0.8s ease;
}

/* ── Layout ── */
.pio-main {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 900px;
  height: calc(100vh - 72px);
  margin: 72px auto 0;

  display: flex;
  justify-content: center;
  align-items: stretch;
  gap: 0;

  overflow: hidden;
  box-sizing: border-box;

}

/* ── Right: thumbnails ── */
.pio-nav {
  flex: 0 0 110px;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  gap: 22px; padding: 0 4px 0 12px;
}
.pio-thumb {
  background: transparent !important; border: none !important;
  border-radius: 0 !important; padding: 0 !important; gap: 0 !important;
  width: 96px; height: 106px; cursor: pointer; opacity: 0.5;
  transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1),
              opacity 0.4s ease, filter 0.4s ease;
}
.pio-thumb:hover, .pio-thumb.active {
  background-color: transparent !important; border-color: transparent !important;
}
.pio-thumb.active              { opacity: 1; transform: scale(1.18); }
.pio-thumb:hover:not(.active)  { opacity: 0.8; transform: scale(1.08); }
.thumb-img { width: 100%; height: 100%; object-fit: contain; display: block; }

/* ── Center: character ── */
.pio-hero {
  flex: 1; min-width: 0; position: relative;
  display: flex; align-items: flex-end; justify-content: center;
  overflow: hidden;
}
.pio-char-glow {
  display: none;
}
.pio-char-shadow { display: none; }
.pio-char {
  position: relative; z-index: 3;
  width: auto; height: 100%; max-width: 660px;
  object-fit: contain; object-position: bottom center; display: block;
}


/* ── Character animations ── */
@keyframes charOut { from{opacity:1;transform:translateY(0) scale(1)} to{opacity:0;transform:translateY(55px) scale(0.96)} }
@keyframes charIn  { from{opacity:0;transform:translateY(55px) scale(0.96)} to{opacity:1;transform:translateY(0) scale(1)} }

.pio-char.anim-exit,  .pio-char-glow.anim-exit  { animation: charOut 0.28s ease-out both; }
.pio-char.anim-enter, .pio-char-glow.anim-enter  { animation: charIn  0.55s cubic-bezier(0.22,1,0.36,1) both; }

/* ── Left: info ── */
.pio-info {
  flex: 0 0 260px;
  display: flex; align-items: center;
  padding: 0 20px 0 8px;
}
.pio-info-inner {
  width: 100%; display: flex; flex-direction: column; gap: 18px;
}

/* Staggered text animations */
@keyframes txtOut { from{opacity:1;transform:translateY(0)}    to{opacity:0;transform:translateY(22px)} }
@keyframes txtIn  { from{opacity:0;transform:translateY(26px)} to{opacity:1;transform:translateY(0)}    }

.pio-name.anim-exit { animation: txtOut 0.2s ease-out both; }
.pio-bio.anim-exit  { animation: txtOut 0.2s ease-out 0.04s both; }
.pio-btn.anim-exit  { animation: txtOut 0.2s ease-out 0.08s both; }

.pio-name.anim-enter { animation: txtIn 0.4s cubic-bezier(0.22,1,0.36,1) 0.3s  both; }
.pio-bio.anim-enter  { animation: txtIn 0.4s cubic-bezier(0.22,1,0.36,1) 0.45s both; }
.pio-btn.anim-enter  { animation: txtIn 0.4s cubic-bezier(0.22,1,0.36,1) 0.6s  both; }

.pio-name {
  font-size: clamp(1.8rem,2.6vw,2.6rem); font-weight: 900;
  color: #fff; line-height: 1.3; margin: 0;
}
.pio-name-line {
  display: block; width: 60px; height: 3px; border-radius: 4px;
  margin-top: 14px; transition: background-color 0.75s ease;
}
.pio-bio {
  font-size: 0.95rem; color: rgba(255,255,255,0.62);
  line-height: 2; margin: 0;
}
.pio-btn {
  display: inline-block; align-self: flex-start;
  padding: 13px 34px; border-radius: 60px; border: none;
  font-family: var(--font); font-size: 0.97rem; font-weight: 700;
  cursor: pointer; color: #1a1200;
  transition: background 0.75s ease, box-shadow 0.75s ease, transform 0.3s ease;
}
.pio-btn:hover { transform: translateY(-3px); }

/* ── Responsive ── */
@media (max-width: 980px) {
  .pio-main { flex-direction: column; height: auto; min-height: calc(100vh - 72px); align-items: center; overflow: visible; max-width: 100%; }
  .pio-nav  { order:3; flex:none; flex-direction:row; width:100%; justify-content:center; padding:16px 0 28px; gap:16px; }
  .pio-thumb { width: 96px; height: 106px; }
  .pio-hero { order:1; flex:none; width:100%; height:55vh; }
  .pio-char { height:100%; max-width:280px; }
  .pio-info { order:2; flex:none; width:100%; padding:28px 8% 20px; justify-content:center; }
  .pio-info-inner { align-items:center; text-align:center; }
  .pio-name-line  { margin:12px auto 0; }
  .pio-btn        { align-self:center; }
}
@media (max-width: 480px) {
  .pio-thumb { width:70px; height:78px; }
  .pio-name  { font-size:1.5rem; }
  .pio-bio   { font-size:0.86rem; }
  .pio-btn   { font-size:0.88rem; padding:11px 26px; }
}
</style>
</head>

<body>

<!-- طبقتا الخلفية للـ crossfade -->
<div class="pio-bg" id="pioBgA"></div>
<div class="pio-bg" id="pioBgB"></div>
<div class="page-glass"></div>
<div class="pio-overlay" id="pioOverlay"></div>

<!-- ══ Header ══ -->
<header class="hdr solid" id="hdr">
  <a href="index.html" class="logo">
    <img class="logo-img" src="assets/logo.png" alt="منصة الأول">
  </a>
  <ul class="nav" id="mainNav">
    <li><a href="index.html">الصفحة الرئيسية</a></li>
    <li><a href="pioneers.html" style="color:var(--T)">رواد التميز</a></li>
    <li><a href="index.html#fields-sec">المجالات</a></li>
    <li><a href="index.html#about-sec">من نحن</a></li>
  </ul>
  <a href="#" class="btn-login">تسجيل الدخول</a>
  <div class="burger" id="burger"><span></span><span></span><span></span></div>
</header>

<!-- ══ Main ══ -->
<main class="pio-main">

  <!-- RIGHT: Thumbnails -->
  <nav class="pio-nav" id="pioNav" aria-label="اختر الشخصية"></nav>

  <!-- CENTER: Hero -->
  <div class="pio-hero">
    <div class="pio-char-glow" id="pioGlow"></div>
    <img class="pio-char-shadow" id="pioShadow" src="" alt="">
    <img class="pio-char"        id="pioChar"   src="" alt="">
  </div>

  <!-- LEFT: Info -->
  <section class="pio-info" aria-live="polite">
    <div class="pio-info-inner" id="pioInfoInner">
      <h2 class="pio-name">
        <span id="pioNameText"></span>
        <span class="pio-name-line" id="pioLine"></span>
      </h2>
      <p class="pio-bio" id="pioBio"></p>
      <button class="pio-btn" id="pioBtn" aria-disabled="true"></button>
    </div>
  </section>

</main>

<script src="script.js"></script>
<script>
(function () {
  'use strict';

  /* ══ Character data ══ */
  var CHARS = [
    {
      name:      'علي القرني',
      bio:       'رائد فضاء سعودي، شارك في مهمة Axiom Mission 2 إلى محطة الفضاء الدولية. لديه خبرة في الطيران العسكري، ومهتم بالعلوم والتقنية، ويمثل الجيل الجديد من رواد الفضاء في المملكة.',
      btn:       'جرب مع علي',
      color:     '#f0f600',
      rgb:       '240,246,0',
      thumbImg:  'assets/مثلث علي.png',
      full:      'assets/علي.png',
      bg:        'assets/خلفية علي القرني.png',
    },
    {
      name:      'ريانة برناوي',
      bio:       'أول رائدة فضاء سعودية وعربية، شاركت في مهمة Axiom Mission 2. متخصصة في الأبحاث الطبية والعلوم الحيوية، وتمثل رمزاً للمرأة السعودية في ميدان الفضاء.',
      btn:       'جرب مع ريانة',
      color:     '#b06cc4',
      rgb:       '76,26,87',
      thumbImg:  'assets/مثلث ريانة.png',
      full:      'assets/ريانة.png',
      bg:        'assets/خلفية ريانة.png',
    },
    {
      name:      'الأمير سلطان بن سلمان',
      bio:       'أول رائد فضاء عربي ومسلم، أقام في مكوك الفضاء ديسكفري عام 1985. رجل دولة وقيادي بارز في مجال السياحة والتراث، وسفير للوطن نحو النجوم.',
      btn:       'جرب مع الأمير سلطان',
      color:     '#00a8aa',
      rgb:       '0,168,170',
      thumbImg:  'assets/مثلث الامير.png',
      full:      'assets/سلطان.png',
      bg:        'assets/خلفية الأمير سلطان.png',
    },
  ];

  /* ══ DOM refs ══ */
  var pioNav       = document.getElementById('pioNav');
  var pioChar      = document.getElementById('pioChar');
  var pioGlow      = document.getElementById('pioGlow');
  var pioNameText  = document.getElementById('pioNameText');
  var pioBio       = document.getElementById('pioBio');
  var pioBtn       = document.getElementById('pioBtn');
  var pioLine      = document.getElementById('pioLine');
  var pioOverlay   = document.getElementById('pioOverlay');
  var pioNameEl    = document.querySelector('.pio-name');
  var bgA          = document.getElementById('pioBgA');
  var bgB          = document.getElementById('pioBgB');

  var current     = 0;
  var isAnimating = false;
  var thumbEls    = [];
  var activeBg    = 'A'; /* أي طبقة خلفية ظاهرة حالياً */

  /* ══ Crossfade background ══ */
  function swapBg(url) {
    var imgUrl = 'url("' + url + '")';
    if (activeBg === 'A') {
      bgB.style.backgroundImage = imgUrl;
      bgA.style.opacity = '0';
      bgB.style.opacity = '1';
      activeBg = 'B';
    } else {
      bgA.style.backgroundImage = imgUrl;
      bgB.style.opacity = '0';
      bgA.style.opacity = '1';
      activeBg = 'A';
    }
  }

  /* ══ Build thumbnails ══
     Structure: triangle PNG (base) + photo on top clipped to triangle
  ══ */
  CHARS.forEach(function (c, i) {
    var div = document.createElement('div');
    div.className = 'pio-thumb' + (i === 0 ? ' active' : '');
    div.setAttribute('role', 'button');
    div.setAttribute('tabindex', '0');
    div.setAttribute('aria-label', c.name);

    /* صورة واحدة — المثلث والشخصية مدمجان */
    var img = document.createElement('img');
    img.className = 'thumb-img';
    img.src = c.thumbImg;
    img.alt = c.name;

    div.appendChild(img);

    div.addEventListener('click', function () { switchTo(i); });
    div.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') switchTo(i);
    });

    pioNav.appendChild(div);
    thumbEls.push(div);
  });

  /* ══ Apply character data ══ */
  function applyData(idx) {
    var c = CHARS[idx];

    pioChar.src             = c.full;
    pioChar.alt             = c.name;
    pioNameText.textContent = c.name;
    pioBio.textContent      = c.bio;
    pioBtn.textContent      = c.btn;

    pioLine.style.backgroundColor = c.color;
    pioBtn.style.background       = 'linear-gradient(135deg,' + c.color + ' 0%,#ffffff 100%)';
    pioBtn.style.boxShadow        = '0 8px 30px rgba(' + c.rgb + ',0.45)';
    pioGlow.style.backgroundColor = c.color;

    swapBg(c.bg);
    pioOverlay.style.backgroundColor = 'rgba(' + c.rgb + ',0.13)';

    thumbEls.forEach(function (t, ti) {
      var active = ti === idx;
      t.classList.toggle('active', active);
      t.style.filter = '';
    });
  }


  /* ══ Switch with animation ══ */
  function switchTo(idx) {
    if (isAnimating || idx === current) return;
    isAnimating = true;

    /* ── Exit ── */
    pioChar.classList.add('anim-exit');
    pioGlow.classList.add('anim-exit');
    pioNameEl.classList.add('anim-exit');
    pioBio.classList.add('anim-exit');
    pioBtn.classList.add('anim-exit');


    setTimeout(function () {
      current = idx;
      applyData(idx);

      /* Remove exit classes */
      pioChar.classList.remove('anim-exit');
      pioGlow.classList.remove('anim-exit');
      pioNameEl.classList.remove('anim-exit');
      pioBio.classList.remove('anim-exit');
      pioBtn.classList.remove('anim-exit');

      void pioChar.offsetHeight;


      /* ── Enter: character ── */
      pioChar.classList.add('anim-enter');
      pioGlow.classList.add('anim-enter');

      /* ── Enter: text staggered ── */
      pioNameEl.classList.add('anim-enter');
      pioBio.classList.add('anim-enter');
      pioBtn.classList.add('anim-enter');

      setTimeout(function () {
        pioChar.classList.remove('anim-enter');
        pioGlow.classList.remove('anim-enter');
        pioNameEl.classList.remove('anim-enter');
        pioBio.classList.remove('anim-enter');
        pioBtn.classList.remove('anim-enter');
        isAnimating = false;
      }, 750);

    }, 280);
  }

  /* ══ Preload images ══ */
  CHARS.forEach(function (c) {
    new Image().src = c.full;
    new Image().src = c.thumbImg;
    new Image().src = c.bg;
  });

  /* ══ Init ══ */
  applyData(0);

  pioChar.classList.add('anim-enter');
  pioGlow.classList.add('anim-enter');
  pioNameEl.classList.add('anim-enter');
  pioBio.classList.add('anim-enter');
  pioBtn.classList.add('anim-enter');

  setTimeout(function () {
    pioChar.classList.remove('anim-enter');
    pioGlow.classList.remove('anim-enter');
    pioNameEl.classList.remove('anim-enter');
    pioBio.classList.remove('anim-enter');
    pioBtn.classList.remove('anim-enter');
  }, 800);

})();
</script>

</body>
</html>
